<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Vikki</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#16283a,#04070b 75%);font-family:Segoe UI,Arial,sans-serif;color:#cfe9f5;overflow:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
svg{height:72vh;max-width:92vw}
#status{letter-spacing:.35em;font-size:13px;opacity:.85}
#text{max-width:70vw;min-height:44px;text-align:center;margin-top:10px;font-size:16px}
#dot{position:fixed;top:14px;right:18px;font-size:12px;opacity:.8}
#help{position:fixed;bottom:10px;width:100%;text-align:center;font-size:11px;opacity:.5}
</style></head><body>
<div id="dot">● offline</div>
<div id="wrap">
<svg viewBox="0 0 400 420">
<defs>
<linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3f7"/><stop offset=".5" stop-color="#a9b6c2"/><stop offset="1" stop-color="#5f6d7a"/></linearGradient>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="all" style="color:#36e8ff">
<line x1="200" y1="62" x2="200" y2="30" stroke="#7f8c99" stroke-width="5"/>
<circle id="ant" cx="200" cy="24" r="8" fill="currentColor" filter="url(#g)"/>
<ellipse cx="66" cy="205" rx="26" ry="48" fill="url(#m)" stroke="#6f7c89" stroke-width="2"/>
<ellipse cx="66" cy="205" rx="12" ry="30" fill="none" stroke="currentColor" stroke-width="5" filter="url(#g)"/>
<ellipse cx="334" cy="205" rx="26" ry="48" fill="url(#m)" stroke="#6f7c89" stroke-width="2"/>
<ellipse cx="334" cy="205" rx="12" ry="30" fill="none" stroke="currentColor" stroke-width="5" filter="url(#g)"/>
<rect x="165" y="320" width="70" height="60" rx="12" fill="url(#m)" stroke="#6f7c89"/>
<rect x="150" y="372" width="100" height="22" rx="11" fill="url(#m)" stroke="#6f7c89"/>
<rect x="84" y="58" width="232" height="272" rx="72" fill="url(#m)" stroke="#6f7c89" stroke-width="3"/>
<path d="M110 92 Q130 68 170 64" stroke="#fff" stroke-opacity=".8" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="108" y="92" width="184" height="206" rx="46" fill="#04080c" stroke="#1d2c39" stroke-width="3"/>
<g filter="url(#g)">
 <g id="ey">
  <ellipse id="e1" cx="155" cy="175" rx="17" ry="20" fill="currentColor"/>
  <ellipse id="e2" cx="245" cy="175" rx="17" ry="20" fill="currentColor"/>
  <path id="a1" d="M138 184 Q155 156 172 184" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" style="opacity:0"/>
  <path id="a2" d="M228 184 Q245 156 262 184" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" style="opacity:0"/>
 </g>
 <path id="mo" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g></g></svg>
<div id="status">OFFLINE</div><div id="text">Press SPACE to test the mouth</div>
</div>
<div id="help">SPACE = talk &nbsp;|&nbsp; keys 1-8 = happy, excited, sad, surprised, confused, error, goodbye, normal</div>
<script>
const $=id=>document.getElementById(id);
const C={cyan:[54,232,255],blue:[100,165,255],amber:[255,200,74],red:[255,110,80],warm:[130,255,200]};
const base={eye:1,smile:0,curve:.25,open:0,w:40,lx:0,ly:0,e2:1,tilt:0,col:C.cyan};
const S={
 idle:{eye:.85},listening:{eye:1.1,curve:0,open:.08},
 thinking:{eye:.75,curve:0,col:C.blue,tilt:3},speaking:{},neutral:{},
 happy:{smile:1,curve:1,open:.3,col:C.warm,tilt:2},
 excited:{eye:1.25,smile:.3,curve:1,open:.55,col:C.warm},
 sad:{eye:.6,curve:-.8,ly:6,col:C.blue,tilt:-2},
 surprised:{eye:1.35,curve:0,open:.9,w:14},
 confused:{eye:.8,e2:.45,curve:-.25,open:.05,col:C.amber,tilt:-5},
 error:{eye:.55,curve:-.6,col:C.red},
 goodbye:{smile:1,curve:1,open:.15,col:C.warm}
};
const P={...base,col:[...C.cyan]};
let state="idle",mood="neutral",offline=true,demo=false,bt=-1,nb=2,mt;

function setMood(m){mood=m;clearTimeout(mt);if(m!=="neutral")mt=setTimeout(()=>mood="neutral",9000);}
function moodOf(t){t=t.toLowerCase();
 if(/sorry|apolog|unfortunately|can't|cannot|couldn't/.test(t))return"sad";
 if(/bye|goodbye|see you/.test(t))return"goodbye";
 if(/haha|funny|joke|lol/.test(t))return"happy";
 if(/awesome|amazing|great|congrat|fantastic|!/.test(t))return"excited";
 if(/whoa|wow|surpris/.test(t))return"surprised";
 if(/not sure|don't understand|unclear|didn't catch|\?\s*$/.test(t))return"confused";
 if(/thank|welcome|glad|happy/.test(t))return"happy";
 return"neutral";}

function connect(){
 const ws=new WebSocket("ws://localhost:8765");
 ws.onopen=()=>{offline=false;$("dot").textContent="● connected";};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==="state")state=m.state;
  if(m.type==="text"){$("text").textContent=(m.role==="user"?"You: ":"")+m.text;
   setMood(m.role==="user"?"neutral":moodOf(m.text));}};
 ws.onclose=()=>{if(!demo)offline=true;$("dot").textContent="● offline";setTimeout(connect,2000);};
}
connect();

const M=["happy","excited","sad","surprised","confused","error","goodbye","neutral"];
addEventListener("keydown",e=>{demo=true;offline=false;
 if(e.code==="Space")state=state==="speaking"?"idle":"speaking";
 else if(e.key>="1"&&e.key<="8")setMood(M[e.key-1]);});

function frame(ms){
 const t=ms/1000,talking=state==="speaking";
 const k=offline?"error":(S[state]?state:"idle");
 let T={...base,...S[k]};
 if(!offline&&(state==="speaking"||state==="idle")&&mood!=="neutral")T={...T,...S[mood]};
 if(state==="thinking"){T.lx=Math.sin(t*1.6)*10;T.ly=-8;}
 if(state==="listening")T.lx=Math.sin(t*.8)*3;
 if(offline)T.lx=Math.sin(t*.9)*10;
 if(talking)T.open=T.open*.4+Math.max(0,Math.sin(t*13)*.5+Math.sin(t*21)*.3+Math.random()*.3);
 for(const q of["eye","smile","curve","open","w","lx","ly","e2","tilt"])P[q]+=(T[q]-P[q])*(q==="open"?.45:.14);
 for(let i=0;i<3;i++)P.col[i]+=(T.col[i]-P.col[i])*.14;

 // blink every 2-5 seconds
 let b=0;
 if(bt<0&&t>nb)bt=t;
 if(bt>=0){const p=(t-bt)/.2;b=p<.5?p*2:Math.max(0,2-p*2);if(p>=1){bt=-1;nb=t+2+Math.random()*3.5;b=0;}}

 // eyes
 const ry=Math.max(1.5,20*P.eye*(1-b)),sm=Math.min(1,Math.max(0,P.smile));
 $("e1").setAttribute("ry",ry);$("e2").setAttribute("ry",Math.max(1.5,ry*P.e2));
 $("e1").style.opacity=$("e2").style.opacity=1-sm;
 $("a1").style.opacity=$("a2").style.opacity=sm;
 $("ey").setAttribute("transform",`translate(${P.lx} ${P.ly})`);

 // mouth
 const w=P.w,c=P.curve*26,o=P.open*38,y=238;
 if(o<2){
  $("mo").setAttribute("fill","none");
  $("mo").setAttribute("d",`M${200-w} ${y} Q200 ${y+c} ${200+w} ${y}`);
 }else{
  $("mo").setAttribute("fill","currentColor");
  $("mo").setAttribute("d",`M${200-w} ${y} Q200 ${y+c*.6} ${200+w} ${y} Q200 ${y+c+o*1.9} ${200-w} ${y}Z`);
 }

 // color, antenna, head movement
 $("all").style.color=`rgb(${P.col.map(Math.round)})`;
 $("ant").style.opacity=state==="listening"?.5+.5*Math.sin(t*6):1;
 $("all").setAttribute("transform",`rotate(${P.tilt+Math.sin(t*.7)} 200 300) translate(0 ${Math.sin(t*1.5)*2})`);
 $("status").textContent=(offline?"OFFLINE":state).toUpperCase()+(mood!=="neutral"?"  ·  "+mood.toUpperCase():"");
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
